name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: "17"

jobs:
  # ---------------------------------------------------------------------------
  # Compiles the whole project (main + test sources). Fails fast before the
  # slower jobs (Testcontainers-backed tests, Docker build, scans) even start.
  # ---------------------------------------------------------------------------
  build:
    name: Compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Compile main + test sources
        run: ./gradlew compileKotlin compileTestKotlin --no-daemon

  # ---------------------------------------------------------------------------
  # Full test suite, including ModularityTests (Spring Modulith boundary
  # check) and the Testcontainers-backed AuthServiceTest against a real
  # Postgres. GitHub-hosted ubuntu runners have Docker available, so
  # Testcontainers works here even though it doesn't locally on Windows.
  # ---------------------------------------------------------------------------
  test:
    name: Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Run test suite
        run: ./gradlew test --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Secret scanning over the full git history. Runs the gitleaks CLI image
  # directly (not the gitleaks/gitleaks-action marketplace action), since
  # that action requires a paid license for private-org repos -- the
  # underlying tool itself is free regardless of repo visibility.
  # ---------------------------------------------------------------------------
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" zricethezav/gitleaks:latest \
            detect --source="/repo" --verbose --redact --exit-code 1

  # ---------------------------------------------------------------------------
  # Dependency vulnerability + misconfiguration scan over the repo contents
  # (build.gradle.kts dependency graph, Dockerfile, compose.yaml, etc.).
  # ---------------------------------------------------------------------------
  trivy-fs:
    name: Dependency & config scan (trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,config
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          trivyignores: .trivyignore

  # ---------------------------------------------------------------------------
  # Builds the production Docker image once, scans it for OS + application
  # vulnerabilities, and (pushes to main only) publishes that exact image to
  # GitHub Container Registry tagged with the commit SHA. The deploy job pulls
  # it, so the server never compiles anything. An image that fails the scan is
  # never pushed; one whose other checks fail is pushed but never deployed.
  # ---------------------------------------------------------------------------
  docker-build-and-scan:
    name: Docker build + image scan (trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/azif-tech-solutions/backend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # Layer cache in GitHub Actions' cache, so Gradle dependencies aren't downloaded every run.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          trivyignores: .trivyignore

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: docker push ${{ env.IMAGE }}:${{ github.sha }}

  # ---------------------------------------------------------------------------
  # Boots the real stack (Postgres + the built image) via the project's own
  # compose.yaml, confirms Flyway migrations V1-V4 apply cleanly against a
  # fresh database, then runs the full Postman collection through Newman as
  # an end-to-end smoke test -- the same verification used throughout local
  # development, now automated.
  # ---------------------------------------------------------------------------
  migration-and-smoke-check:
    name: Migration + API smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Start stack
        # compose.local-storage.yaml adds S3Mock so file uploads work without AWS credentials.
        run: docker compose -f compose.yaml -f compose.local-storage.yaml up --build -d

      - name: Wait for app health
        run: |
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "App is healthy"
              exit 0
            fi
            sleep 3
          done
          echo "App did not become healthy in time"
          docker compose -f compose.yaml -f compose.local-storage.yaml logs
          exit 1

      - name: Confirm Flyway migrations applied
        run: |
          docker compose -f compose.yaml -f compose.local-storage.yaml logs backend | grep -q "Successfully applied .* migrations" \
            || (echo "Flyway did not report a successful migration" && docker compose -f compose.yaml -f compose.local-storage.yaml logs backend && exit 1)

      - name: Run Postman collection (Newman)
        run: |
          npx newman run postman/ZifIQ-API.postman_collection.json \
            -e postman/ZifIQ-Local.postman_environment.json \
            --reporters cli

      - name: Stack logs (on failure)
        if: failure()
        run: docker compose -f compose.yaml -f compose.local-storage.yaml logs

      - name: Tear down
        if: always()
        run: docker compose -f compose.yaml -f compose.local-storage.yaml down -v

  # ---------------------------------------------------------------------------
  # Flags newly-introduced vulnerable dependencies on pull requests, by
  # diffing the dependency graph against the base branch.
  # ---------------------------------------------------------------------------
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  # ---------------------------------------------------------------------------
  # Single required status check for branch protection -- green only when
  # every gate above passed. Point your "commence deployment" trigger at this.
  # ---------------------------------------------------------------------------
  ready-to-deploy:
    name: Ready to deploy
    if: always()
    needs:
      - test
      - gitleaks
      - trivy-fs
      - docker-build-and-scan
      - migration-and-smoke-check
    runs-on: ubuntu-latest
    steps:
      - name: Check all required jobs succeeded
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] || [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "One or more required checks failed."
            exit 1
          fi
          echo "All required checks passed. Ready to deploy."

  # ---------------------------------------------------------------------------
  # Deploys to the dev EC2 box by pulling the image CI built, scanned and
  # published (docker-build-and-scan): the box itself never compiles, so a
  # deploy takes about a minute instead of a 10-minute Gradle build on a 1 GB
  # machine. The repo files (compose.yaml etc.) are still rsynced; the box's own
  # .env (bucket, secrets, the deployed image tag) is never overwritten.
  #
  # The box logs in to ghcr.io with this run's short-lived GITHUB_TOKEN
  # (packages: read) and logs out again: no long-lived registry credential is
  # stored there. The deploy fails unless the new container reports healthy.
  # Roll back = re-run the deploy job of an earlier successful run.
  #
  # Needs three repo secrets: EC2_SSH_PRIVATE_KEY (the full .pem contents),
  # EC2_HOST, EC2_USER. Only runs after every check above has passed, and only
  # for pushes to main (never on pull_request).
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to dev EC2
    needs: ready-to-deploy
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Sync repo to EC2
        uses: burnett01/rsync-deployments@7.0.1
        with:
          # .env holds the server's own settings (storage bucket, secrets, image tag) and must survive deploys.
          switches: -avz --delete --exclude=.git --exclude=.env
          path: ./
          remote_path: ~/backend/
          remote_host: ${{ secrets.EC2_HOST }}
          remote_user: ${{ secrets.EC2_USER }}
          remote_key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}

      - name: Pull the new image and restart
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          ZIFIQ_IMAGE: ghcr.io/azif-tech-solutions/backend:${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          envs: GHCR_TOKEN,GHCR_USER,ZIFIQ_IMAGE
          command_timeout: 15m
          script: |
            set -e
            cd ~/backend
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker pull "$ZIFIQ_IMAGE"
            docker logout ghcr.io
            # Record the deployed image in the box's .env, so a manual `docker compose up -d` there runs it too.
            touch .env
            if grep -q '^ZIFIQ_IMAGE=' .env; then sed -i "s|^ZIFIQ_IMAGE=.*|ZIFIQ_IMAGE=$ZIFIQ_IMAGE|" .env; else echo "ZIFIQ_IMAGE=$ZIFIQ_IMAGE" >> .env; fi
            docker compose up -d --no-build
            echo "Waiting for the new container to report healthy..."
            for _ in $(seq 1 60); do
              if curl -sf http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then echo "Healthy: $ZIFIQ_IMAGE"; break; fi
              sleep 5
            done
            curl -sf http://localhost:8080/actuator/health | grep -q '"status":"UP"' || { echo "Not healthy after 5 minutes"; docker compose logs --tail 150 backend; exit 1; }
            # Keep a week of images for rollbacks; nothing is built here any more, so drop any build cache.
            docker image prune -af --filter "until=168h"
            docker builder prune -af
            df -h /
