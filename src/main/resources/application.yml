# Every credential and per-environment value comes from the environment, never from this file:
# DATABASE_URL, DATABASE_USERNAME, DATABASE_PASSWORD, JWT_SECRET, CORS_ALLOWED_ORIGINS, ZIFIQ_STORAGE_*.
# Locally they live in backend/.env (git-ignored; copy .env.example), which bootRun reads through
# spring.config.import below; on the server, docker compose passes them in from ~/backend/.env.
# A missing secret stops the app at startup instead of falling back to a default.
spring:
  application:
    name: zifiq-backend
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
    postgresql:
      # Lock with a session advisory lock, not inside an open transaction: CREATE INDEX CONCURRENTLY
      # (V13) waits for every older transaction to finish, so a transactional lock would make it wait
      # on Flyway itself forever. Tests set the same flag (PostgresIntegrationTest).
      transactional-lock: false
  servlet:
    multipart:
      # Hard ceiling for any upload; each file purpose sets its own lower limit (docs/03 §8.4).
      max-file-size: 25MB
      max-request-size: 26MB

jwt:
  # At least 32 bytes of randomness, e.g. `openssl rand -base64 48`. Changing it logs everyone out.
  secret: ${JWT_SECRET}

cors:
  # Comma-separated browser origins allowed to call the API (exact origins for deployed sites).
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}

server:
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# File storage (docs/03 §8.4). With no bucket the app runs normally and file endpoints answer 503
# STORAGE_NOT_CONFIGURED. On EC2 credentials come from the instance's IAM role; locally use S3Mock
# (see README). Never put real AWS keys in this file.
zifiq:
  storage:
    bucket: ${ZIFIQ_STORAGE_BUCKET:}
    region: ${ZIFIQ_STORAGE_REGION:}
    # S3-compatible endpoint for local development (S3Mock: http://localhost:9090); leave empty for AWS S3.
    endpoint: ${ZIFIQ_STORAGE_ENDPOINT:}
    # Separates environments sharing a bucket, e.g. "dev/".
    key-prefix: ${ZIFIQ_STORAGE_KEY_PREFIX:}
    download-url-ttl: ${ZIFIQ_STORAGE_DOWNLOAD_URL_TTL:5m}
  invoicing:
    sandbox:
      # POST /api/v1/invoicing/sandbox/invoices: raise invoices from made-up sales until Sales & POS
      # (docs/09) exists to issue real ones. Set ZIFIQ_INVOICING_SANDBOX=false to switch it off.
      enabled: ${ZIFIQ_INVOICING_SANDBOX:true}
