spring:
  application:
    name: zifiq-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/zifiq}
    username: ${DATABASE_USERNAME:zifiq_app}
    password: ${DATABASE_PASSWORD:zifiq-local}
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET:zifiq-secret-key-must-be-at-least-256-bits-long-for-hmac-sha256-signing!}

server:
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
