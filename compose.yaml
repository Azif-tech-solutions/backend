name: zifiq-backend

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: zifiq
      POSTGRES_USER: zifiq_admin
      POSTGRES_PASSWORD: zifiq-local
    ports:
      - "5434:5432"
    volumes:
      - zifiq-postgres:/var/lib/postgresql/data
      - ./docker/init/01-application-role.sql:/docker-entrypoint-initdb.d/01-application-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zifiq_admin -d zifiq"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: .
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/zifiq
      DATABASE_USERNAME: zifiq_app
      DATABASE_PASSWORD: zifiq-local
      # File storage (docs/03 §8.4). Set these in a .env file next to this one (never committed; the
      # deploy keeps the server's own copy). On EC2 the AWS credentials come from the instance's IAM
      # role. Locally/CI, compose.local-storage.yaml points these at S3Mock instead.
      ZIFIQ_STORAGE_BUCKET: ${ZIFIQ_STORAGE_BUCKET:-}
      ZIFIQ_STORAGE_REGION: ${ZIFIQ_STORAGE_REGION:-eu-north-1}
      ZIFIQ_STORAGE_KEY_PREFIX: ${ZIFIQ_STORAGE_KEY_PREFIX:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  zifiq-postgres:
